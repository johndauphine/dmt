# Cross-DB integration tests (#230).
#
# Spins up real MSSQL + PG service containers, loads the SO2010-minimal
# fixture into MSSQL, and runs a real dmt mssql→pg migration end-to-end
# against them. Failing this job blocks the PR — every PR proves that
# the primary cross-DB migration path still works.
#
# Per the #230 issue body, the full 6-pair matrix (mssql↔pg, mssql↔mysql,
# pg↔mysql) is the eventual goal; this PR ships mssql→pg only because
# pg-source and mysql-source equivalents of SO2010-minimal don't exist
# yet. Tracked as a follow-up.
#
# Local reproduction: `make test-dbs-up && make integration-test` —
# see CONTRIBUTING.md.

name: integration

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mssql-to-postgres:
    name: mssql → postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          SA_PASSWORD: TestPass2024
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        # No HEALTHCHECK on the upstream image; we poll explicitly below.

      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: TestPass2024
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      MSSQL_PASSWORD: TestPass2024
      PG_PASSWORD: TestPass2024
      # The fixture loader auto-detects mssql-test/mssql-bench by name;
      # GHA names service containers after the service key (`mssql`).
      MSSQL_CONTAINER: mssql

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build dmt
        run: make build

      - name: Wait for MSSQL to accept connections
        # SQL Server's container reports "Started up" before sqlcmd works.
        # Poll with a short timeout — fail loud at 90s rather than
        # letting the next step hang under the job's 15m timeout.
        run: |
          set -e
          for i in $(seq 1 30); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd \
                 -S localhost -U sa -P "$MSSQL_PASSWORD" -C -l 3 \
                 -Q "SELECT 1" >/dev/null 2>&1; then
              echo "MSSQL ready after $((i * 3))s"
              exit 0
            fi
            sleep 3
          done
          echo "MSSQL did not become ready within 90s"
          docker logs mssql || true
          exit 1

      - name: Load SO2010-minimal fixture into MSSQL
        run: ./scripts/load-fixture-so2010-minimal.sh

      - name: Run dmt mssql → postgres migration
        run: make integration-test

      - name: Validate target row counts
        run: |
          set -e
          # Each source row must land in the target. dmt's built-in
          # validation pass would catch this too but we assert it
          # explicitly here so the CI failure mode is obvious.
          ./dmt -c scripts/fixtures/ci-mssql-pg.yaml validate

      - name: Upload dmt logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dmt-logs-${{ github.run_id }}
          path: |
            /tmp/dmt-ci.log
            ~/.dmt/migrate.db
          if-no-files-found: ignore
