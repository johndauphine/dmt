version: "2"
run:
  # Match go.mod so the linter parses the same language version as the
  # build. Stale `go: "1.21"` here previously caused v2 to silently
  # fail to type-check Go-1.25-only constructs (#230 CI fallout).
  go: "1.25"
linters:
  disable:
    - errcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        - -S1009
        - -SA9003
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        text: notifier\.
      - linters:
          - errcheck
        text: bar\.
      - linters:
          - errcheck
        text: CompleteRun|MarkTaskComplete
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
