# CI-only config for SQLite schema_contract integration scenarios.
#
# The test script sets target_mode plus per-entity contract modes through
# environment variables so one copyable config exercises the whole matrix.

source:
  type: sqlite
  database: ${SQLITE_CONTRACT_SOURCE_DB}

target:
  type: sqlite
  database: ${SQLITE_CONTRACT_TARGET_DB}

migration:
  create_indexes: false
  create_foreign_keys: false
  create_check_constraints: false
  target_mode: ${DMT_SCHEMA_CONTRACT_TARGET_MODE}
  schema_contract:
    tables: ${DMT_SCHEMA_CONTRACT_TABLES}
    columns: ${DMT_SCHEMA_CONTRACT_COLUMNS}
    data_type: ${DMT_SCHEMA_CONTRACT_DATA_TYPE}
  runtime_tuning: false
  chunk_size: 10
  checkpoint_frequency: 1
  data_dir: ${DMT_STATE_DIR}
