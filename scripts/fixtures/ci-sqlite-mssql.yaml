# CI-only config for the sqlite → mssql cross-engine integration test (#291).
# Loaded by the nightly matrix in .github/workflows/integration-nightly.yml
# via scripts/integration-test-pair.sh --pair sqlite-mssql.
#
# Local reproduction:
#   make build && make test-dbs-up
#   ./scripts/integration-test-pair.sh --pair sqlite-mssql
# (the sqlite-source fixture is loaded into the .db file by the runner)

source:
  type: sqlite
  database: ${SQLITE_SOURCE_DB}

target:
  type: mssql
  host: localhost
  port: 1433
  database: so2010_minimal_ci
  user: sa
  password: ${MSSQL_PASSWORD}
  schema: dbo
  encrypt: false
  trust_server_cert: true

migration:
  create_indexes: false
  create_foreign_keys: false
  create_check_constraints: false
  target_mode: drop_recreate
  runtime_tuning: false
  chunk_size: 10
  checkpoint_frequency: 1
  data_dir: ${DMT_STATE_DIR}
