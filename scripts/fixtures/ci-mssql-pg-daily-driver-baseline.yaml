# CI-only baseline config for the mssql -> postgres daily-driver test (#304).
# This drop_recreate run loads the Users table and records sync timestamps
# because date_updated_columns is already configured.

source:
  type: mssql
  host: localhost
  port: 1433
  database: StackOverflow2010Minimal
  user: sa
  password: ${MSSQL_PASSWORD}
  schema: dbo
  encrypt: false
  trust_server_cert: true

target:
  type: postgres
  host: localhost
  port: 5432
  database: so2010_minimal_ci
  user: postgres
  password: ${PG_PASSWORD}
  schema: public
  ssl_mode: disable

migration:
  include_tables:
    - Users
  create_indexes: false
  create_foreign_keys: false
  create_check_constraints: false
  target_mode: drop_recreate
  runtime_tuning: false
  date_updated_columns:
    - LastAccessDate
    - CreationDate
  chunk_size: 10
  checkpoint_frequency: 1
  data_dir: ${DMT_STATE_DIR}
