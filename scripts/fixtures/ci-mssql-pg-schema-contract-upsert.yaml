# CI-only config for the mssql -> postgres schema_contract evolution test.
# Used after a baseline drop_recreate run has captured source schema snapshots
# in the same DMT_STATE_DIR.

source:
  type: mssql
  host: localhost
  port: 1433
  database: StackOverflow2010Minimal
  user: sa
  password: ${MSSQL_PASSWORD}
  schema: dbo
  encrypt: false
  trust_server_cert: true

target:
  type: postgres
  host: localhost
  port: 5432
  database: so2010_minimal_ci
  user: postgres
  password: ${PG_PASSWORD}
  schema: public
  ssl_mode: disable

migration:
  include_tables:
    - Users
  create_indexes: false
  create_foreign_keys: false
  create_check_constraints: false
  target_mode: upsert
  schema_contract:
    tables: report
    columns: evolve
    data_type: evolve
  runtime_tuning: false
  chunk_size: 10
  checkpoint_frequency: 1
  data_dir: ${DMT_STATE_DIR}
