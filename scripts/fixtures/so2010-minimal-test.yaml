# Test config that targets the SO2010-minimal fixture (#178).
# Used by `make test-fixtures-load` smoke + manual dmt-against-fixture runs.
# Not for benchmarking — use config-so2013-bench.yaml for that.

source:
  type: mssql
  host: localhost
  port: 1433
  database: StackOverflow2010Minimal
  user: sa
  password: ${MSSQL_PASSWORD}
  schema: dbo
  encrypt: false
  trust_server_cert: true

target:
  type: postgres
  host: localhost
  port: 5432
  database: so2010_minimal_target
  user: postgres
  password: ${PG_PASSWORD}
  schema: public
  ssl_mode: disable

migration:
  create_indexes: false
  create_foreign_keys: false
  create_check_constraints: false
  target_mode: drop_recreate
  runtime_tuning: false
