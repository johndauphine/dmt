# CI-only config for the mssql → mysql cross-engine integration test (#291).
# Loaded by the nightly matrix in .github/workflows/integration-nightly.yml
# via scripts/integration-test-pair.sh --pair mssql-mysql.
#
# Local reproduction:
#   make build && make test-dbs-up && make mysql-bench-up
#   ./scripts/load-fixture-so2010-minimal.sh --source mssql
#   ./scripts/integration-test-pair.sh --pair mssql-mysql

source:
  type: mssql
  host: localhost
  port: 1433
  database: StackOverflow2010Minimal
  user: sa
  password: ${MSSQL_PASSWORD}
  schema: dbo
  encrypt: false
  trust_server_cert: true

target:
  type: mysql
  host: localhost
  port: 3306
  database: so2010_minimal_ci
  user: root
  password: ${MYSQL_ROOT_PASSWORD}

migration:
  create_indexes: false
  create_foreign_keys: false
  create_check_constraints: false
  target_mode: drop_recreate
  runtime_tuning: false
  chunk_size: 10
  checkpoint_frequency: 1
  data_dir: ${DMT_STATE_DIR}
