# StackOverflow2013 PG→MySQL benchmark (load SO2013 into MySQL)
# Source: pg-bench (port 5432) — assumes SO2013 already migrated to PG
# Target: mysql-bench (port 3306)
# Setup: make bench-dbs-up mysql-bench-up

source:
  type: postgres
  host: localhost
  port: 5432
  database: so2013
  user: postgres
  password: ${POSTGRES_PASSWORD}
  schema: public
  ssl_mode: disable

target:
  type: mysql
  host: localhost
  port: 3306
  database: so2013
  user: root
  password: ${MYSQL_PASSWORD}
  # Local Docker mysql-bench container ships without TLS certs.
  # Production deployments should remove this line so the dialect's
  # default (tls=true, require + verify) applies — see #252.
  ssl_mode: disable

migration:
  target_mode: drop_recreate
  workers: 4
  chunk_size: 25000
  create_indexes: false
  create_foreign_keys: false
