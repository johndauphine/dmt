# StackOverflow2013 benchmark - AI-suggested tuning
# Source: mssql (port 1433)
# Target: postgres (port 5432)

source:
  type: mssql
  host: localhost
  port: 1433
  database: StackOverflow2013
  user: sa
  password: ${MSSQL_PASSWORD}  # Set via environment variable
  schema: dbo
  encrypt: false
  trust_server_cert: true

target:
  type: postgres
  host: localhost
  port: 5432
  database: so2013
  user: postgres
  password: ${POSTGRES_PASSWORD}  # Set via environment variable
  schema: public
  ssl_mode: disable

migration:
  target_mode: drop_recreate
  max_memory_mb: 8192  # Safety cap passed to AI tuner
  ai_adjust: true
