# SQLite catalog (#191 phase 1). The conversion target: every value
# here mirrors the hand-written internal/driver/sqlite package, and the
# differential test in dialect_differential_test.go proves the rendered
# output identical method-by-method. SQLite is the permanent proof
# fixture for the generic engine.
name: sqlite
aliases: [sqlite3, sqlitedb]

connection:
  backend: sqlite                # database/sql driver (modernc, pure Go)
  dsn_strategy: sqlite_file      # imperative DSN: file/:memory:/pragmas
  single_writer: true            # file lock: one open write connection

defaults:
  write_ahead_writers: 1         # file-based, single-writer constraint
  scale_writers_with_cores: false

capabilities:
  upserter: true                 # INSERT ... ON CONFLICT
  sequence_resetter: true        # sqlite_sequence update
  constraint_writer: false       # FK/CHECK are inline-only (#460)
  incremental_date_reader: true

quoting:
  identifier_format: '"%s"'
  escaped_char: '"'
  schema_ignored: true           # no schema concept; implicit "main"

placeholder: "?"

table_hints:
  strict: ""
  relaxed: ""

pagination:
  keyset:
    query: |
      SELECT {columns} FROM {table}
      WHERE {pk} > {?}{max_pk_clause}{date_clause}
      ORDER BY {pk}
      LIMIT {?}
    max_pk_clause: " AND {pk} <= {?}"
    date_clause: " AND {date_column} > {?}"
    args:
      no_max: [last_pk, limit]
      no_max_date: [last_pk, date_from, limit]
      with_max: [last_pk, max_pk, limit]
      with_max_date: [last_pk, max_pk, date_from, limit]

  row_number:
    # SQLite 3.25+ window functions; the date filter lives inside the
    # subquery so __rn numbering reflects the filtered set.
    query: |
      SELECT {outer_columns} FROM (
        SELECT {columns}, ROW_NUMBER() OVER (ORDER BY {order_by}) as __rn
        FROM {table}{where_date}
      )
      WHERE __rn > {?} AND __rn <= {?}
      ORDER BY __rn
    date_clause: " WHERE {date_column} > {?}"
    args:
      no_date: [row_start, row_end]
      date: [date_from, row_start, row_end]

queries:
  # Always a single partition: no parallelism benefit from splitting a
  # single-file, single-writer database.
  partition_boundaries: "SELECT 1 AS partition_id, MIN({pk}), MAX({pk}), COUNT(*) FROM {table}"
  # No stats catalog comparable to information_schema — always COUNT(*).
  row_count: "SELECT COUNT(*) FROM %s"
  date_column: "SELECT type FROM pragma_table_info(?) WHERE name = ?"

# Canonical introspection shapes (see IntrospectionSpec): the SQL
# adapts sqlite's pragma table-valued functions to the generic
# Reader's fixed row mappings.
introspection:
  list_tables: |
    SELECT name FROM sqlite_master
    WHERE type = 'table' AND name NOT LIKE 'sqlite_%'
    ORDER BY name
  # (ordinal, name, decl_type, max_length, precision, scale,
  #  is_nullable, default_value, pk_ordinal) — length/precision/scale
  # are parsed from the declared type (parse_type_params), since
  # sqlite stores "VARCHAR(255)" verbatim from CREATE TABLE.
  describe_table: |
    SELECT cid + 1, name, type, NULL, NULL, NULL,
           CASE "notnull" WHEN 0 THEN 1 ELSE 0 END,
           dflt_value, pk
    FROM pragma_table_info(?)
  parse_type_params: true
  # AUTOINCREMENT is only recorded in the verbatim CREATE TABLE text.
  identity_strategy: sqlite_autoincrement
  index_list: |
    SELECT name, "unique" FROM pragma_index_list(?) WHERE origin != 'pk'
  index_columns: |
    SELECT name FROM pragma_index_info(?) ORDER BY seqno
  foreign_keys: |
    SELECT id, seq, "table", "from", "to", on_update, on_delete
    FROM pragma_foreign_key_list(?) ORDER BY id, seq
  # CHECKs are inline-only in CREATE TABLE and not surfaced — no query;
  # LoadCheckConstraints is a documented no-op (matches the hand-written
  # driver; cross-engine CHECK migration from sqlite is out of scope).
  column_exists: "SELECT 1 FROM pragma_table_info(?) WHERE name = ? LIMIT 1"
  table_exists: "SELECT 1 FROM sqlite_master WHERE type='table' AND name=?"
  has_primary_key: "SELECT 1 FROM pragma_table_info(?) WHERE pk > 0 LIMIT 1"

ddl:
  # No CREATE SCHEMA: a sqlite file IS the database.
  create_schema: ""
  # Toggle FK enforcement around the drop in case dependents exist.
  drop_table_stmts:
    - "PRAGMA foreign_keys = OFF"
    - "DROP TABLE IF EXISTS {table}"
    - "PRAGMA foreign_keys = ON"
  # No TRUNCATE in sqlite; bare DELETE hits the truncate optimization.
  truncate_stmts:
    - "DELETE FROM {table}"
  truncate_cleanup: "DELETE FROM sqlite_sequence WHERE name = ?"
  add_column: "ALTER TABLE {table} ADD COLUMN {column} {type} NULL"
  # PK is declared inline at CREATE TABLE; the phase is a no-op.
  create_primary_key: ""
  can_drop_not_null: false       # requires a table rebuild
  can_alter_column_type: false   # requires a table rebuild

bulk:
  strategy: batched_insert
  # SQLITE_MAX_VARIABLE_NUMBER on modernc (mainline >=3.32): one
  # placeholder per cell, so rows-per-statement = this / columns.
  max_bind_variables: 32766
  row_converter: bool_to_int     # booleans stored as integers

upsert:
  strategy: insert_on_conflict   # INSERT ... ON CONFLICT DO UPDATE

sequence:
  strategy: sqlite_sequence      # lazy sqlite_sequence update/insert

context:
  version_query: "SELECT sqlite_version()"
  version_prefix: "SQLite "
  identifier_case: preserve
  case_sensitive_identifiers: false
  charset: UTF-8
  encoding: UTF-8
  max_identifier_length: 0       # no documented limit
  varchar_semantics: char
  bytes_per_char: 4
  features: [WAL, FTS5, JSON1]

date_types: [datetime, timestamp, date, text]

value_converters: default

preflight_strategy: sqlite

ai:
  prompt_augmentation: |

    SQLite-specific requirements:
    - Use type affinity: INTEGER, REAL, TEXT, BLOB, NUMERIC, BOOLEAN, DATE, DATETIME.
    - Auto-increment columns must be declared as "INTEGER PRIMARY KEY AUTOINCREMENT" inline.
    - SQLite has no schema concept distinct from attached databases; do not qualify with schema.
    - Foreign keys are only enforced when PRAGMA foreign_keys = ON (dmt sets this).
    - ALTER TABLE in SQLite is limited; FK and CHECK constraints must be declared inline.
  drop_table_prompt_augmentation: |

    SQLite-specific requirements:
    - Use DROP TABLE IF EXISTS to handle non-existent tables idempotently.
    - SQLite does not support CASCADE for DROP TABLE; foreign-key enforcement
      must be temporarily disabled if dependent tables exist:
        PRAGMA foreign_keys = OFF;
        DROP TABLE IF EXISTS "<table>";
        PRAGMA foreign_keys = ON;
