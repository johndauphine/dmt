<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dmt WebUI</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b0e14;
      --panel: #141922;
      --border: #232a36;
      --fg: #e6e9ef;
      --muted: #8b93a3;
      --accent: #6ea8fe;
      --ok: #4ade80;
      --err: #f87171;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7f9; --panel: #ffffff; --border: #e3e6ec;
        --fg: #1a1d24; --muted: #5b6472; --accent: #2563eb;
        --ok: #16a34a; --err: #dc2626;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: min(92vw, 460px); background: var(--panel);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 32px; box-shadow: 0 10px 40px rgba(0,0,0,.25);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    .brand .logo {
      width: 34px; height: 34px; border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      display: grid; place-items: center; color: #fff; font-weight: 700;
    }
    h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
    .sub { color: var(--muted); margin: 4px 0 24px; font-size: 13px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 11px 12px; border-radius: 9px;
      border: 1px solid var(--border); background: var(--bg); color: var(--fg);
      font: inherit; margin-bottom: 14px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      width: 100%; padding: 11px; border: 0; border-radius: 9px; cursor: pointer;
      background: var(--accent); color: #fff; font: inherit; font-weight: 600;
    }
    button:disabled { opacity: .6; cursor: default; }
    .status { margin-top: 18px; font-size: 13px; color: var(--muted); min-height: 20px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    .kv { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; display: none; }
    .kv.show { display: block; }
    .kv .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
    .kv .row span:first-child { color: var(--muted); }
    .foot { margin-top: 22px; font-size: 12px; color: var(--muted); text-align: center; }
    .foot code { background: var(--bg); padding: 1px 5px; border-radius: 5px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo">d</div>
      <div>
        <h1>dmt WebUI</h1>
      </div>
    </div>
    <p class="sub">Foundation preview — the full operator UI arrives in a later release.</p>

    <form id="login">
      <label for="token">Auth token</label>
      <input id="token" name="token" type="password" autocomplete="off" placeholder="paste your --webui-auth-token" />
      <button id="submit" type="submit">Sign in</button>
    </form>

    <div id="status" class="status"></div>

    <div id="health" class="kv">
      <div class="row"><span>Service</span><span id="h-name">—</span></div>
      <div class="row"><span>Version</span><span id="h-version">—</span></div>
      <div class="row"><span>Status</span><span id="h-status">—</span></div>
    </div>

    <p class="foot">Served from a single self-contained binary. Press <code>Ctrl+C</code> in the terminal to stop.</p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const setStatus = (msg, cls) => { const s = $("status"); s.textContent = msg; s.className = "status" + (cls ? " " + cls : ""); };

    async function login(token) {
      setStatus("Signing in…");
      $("submit").disabled = true;
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        });
        if (!res.ok) {
          const e = await res.json().catch(() => ({}));
          setStatus((e.error && e.error.message) || "Sign-in failed.", "err");
          return false;
        }
        setStatus("Signed in.", "ok");
        await loadHealth();
        return true;
      } catch (err) {
        setStatus("Network error: " + err.message, "err");
        return false;
      } finally {
        $("submit").disabled = false;
      }
    }

    async function loadHealth() {
      const res = await fetch("/api/health");
      if (!res.ok) return;
      const h = await res.json();
      $("h-name").textContent = h.name || "—";
      $("h-version").textContent = h.version || "—";
      $("h-status").textContent = h.status || "—";
      $("health").classList.add("show");
      $("login").style.display = "none";
    }

    $("login").addEventListener("submit", (e) => {
      e.preventDefault();
      login($("token").value.trim());
    });

    // One-click loopback link carries ?token=…; consume it, then scrub it
    // from the URL so the secret doesn't linger in history or referrers.
    const params = new URLSearchParams(location.search);
    const urlToken = params.get("token");
    if (urlToken) {
      history.replaceState(null, "", location.pathname);
      login(urlToken);
    } else {
      // Maybe already have a valid session cookie.
      loadHealth().catch(() => {});
    }
  </script>
</body>
</html>
